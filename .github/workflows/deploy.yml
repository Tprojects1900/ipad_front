name: Deploy ipad_front to Contabo

on:
  push:
    branches:
      - contabo-main

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Deploy React iPad Frontend
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |

            set -e

            echo "🚀 Début déploiement ipad_front"


            APP_DIR="/var/www/talent-hubapp/ipad_front"


            # Création du dossier si nécessaire
            mkdir -p /var/www/talent-hubapp


            if [ ! -d "$APP_DIR/.git" ]; then

              echo "📦 Premier déploiement"

              rm -rf "$APP_DIR"

              git clone \
              -b contabo-main \
              https://github.com/Tprojects1900/ipad_front.git \
              "$APP_DIR"

            else

              echo "📥 Mise à jour du dépôt"

              cd "$APP_DIR"

              git fetch origin contabo-main

              git reset --hard origin/contabo-main

            fi


            cd "$APP_DIR"


            echo "📦 Installation dépendances"

            npm ci


            echo "🧹 Suppression de l'ancien build"

            rm -rf "$APP_DIR/dist"

            echo "🏗️ Build React"

            npm run build

            echo "📂 Build disponible dans dist"


            echo "🔄 Reload Nginx"

            nginx -t

            systemctl reload nginx


            echo "✅ Déploiement ipad_front terminé"